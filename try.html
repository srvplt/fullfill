      display: flex;

    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 140px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: white;
      flex-shrink: 0;
    }

    .btn img {
      width: 16px;
      height: 16px;

    /* QR */
    .qr-wrap {
      flex: 1;
      display: flex;
      justify-content: flex-start;
    }

    .qr {
      width: 220px;
      background: white;
      padding: 10px;
      border-radius: 14px;
    }

    /* ================= FOOTER ================= */
    footer {
      flex-shrink: 0;
      background: #1e0038 !important;
      color: white;
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 24px;

      align-items: center;
      justify-content: space-between;

      text-align: left;
      font-size: 12px;
    }

    .footer-center {
      flex: 1;
      text-align: center;
    }

    .footer-right {
      flex: 1;
      text-align: right;
    }

    .footer-right img {
      width: 20px;
      margin-left: 10px;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 768px) {
      .try-container {
        flex-direction: column;
        text-align: center;
      }

      .btn-row { justify-content: center; }

      .footer-inner {
        flex-direction: column;
        gap: 10px;
        text-align: center;

      .footer-right { text-align: center; }

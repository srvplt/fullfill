<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>

  <script>
    var ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.mycompany.fullfill2");
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      window.location.replace("https://testflight.apple.com/join/9yHyeEhK");
    } else {
      window.location.replace("https://fullfill.me");
    }
  </script>
</head>
